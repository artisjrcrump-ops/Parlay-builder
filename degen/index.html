<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Degen Parlays</title>
  <link rel="stylesheet" href="degen.css?v=4">
</head>
<body>
  <header>
    <div class="top"><h1>🎲 Degen Parlays</h1><button id="update">↻ Update</button></div>
    <p class="sub">Only your 6 teams. Every DraftKings prop, ⭐ = our pick.</p>
    <div id="who" class="who"></div>
  </header>
  <main>
    <p id="status" class="status"></p>
    <button id="build" class="big" hidden>⚡ Build my parlay from ⭐ picks</button>
    <section id="parlay"></section>
    <section id="board"></section>
  </main>
  <footer>Picks from DraftKings lines (via ESPN) and each player's recent games. Past results, not guarantees. Check prices in your sportsbook.</footer>
  <script src="degen-app.js?v=4"></script>
</body>
</html>
