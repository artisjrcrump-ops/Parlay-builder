<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Parlay Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>Parlay Builder</h1>
      <div class="title-actions">
        <button id="settings" class="icon-btn" aria-label="Settings">⚙︎</button>
        <button id="refresh" class="icon-btn" aria-label="Refresh">↻</button>
      </div>
    </div>
    <nav id="leagues" class="tabs" role="tablist"></nav>
    <div class="date-row">
      <button id="prev-day" class="icon-btn" aria-label="Previous day">‹</button>
      <span id="date-label"></span>
      <button id="next-day" class="icon-btn" aria-label="Next day">›</button>
    </div>
    <div class="sort-row">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="time">Start time</option>
        <option value="weakdef">Weakest defense in game</option>
        <option value="total">Highest total</option>
      </select>
    </div>
  </header>

  <main>
    <p id="status" class="status"></p>
    <section id="games" class="games"></section>
  </main>

  <footer class="foot">
    <p>Off / Def ranks are by points scored and allowed per game. 1 is best. Data: ESPN. Lines shown are ESPN's (DraftKings).</p>
  </footer>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <button id="sheet-back" class="icon-btn" aria-label="Back" hidden>‹</button>
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="players.js"></script>
  <script src="odds.js"></script>
</body>
</html>
